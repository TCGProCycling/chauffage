<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chauffage</title>
<meta name="description" content="Pilotage des radiateurs de la maison">
<meta name="theme-color" content="#E7ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chauffage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7ECEF; --surface:#F6F8F9; --surface-2:#DDE4E8; --ink:#1C2730; --ink-2:#4A5966; --line:#C9D3DA;
  --cold:#C3D6E5; --warm:#F3C48E; --off:#D3D9DD;
  --accent:#1F5F99; --accent-ink:#FFFFFF;
  --ok:#2F7D5B; --alert:#A8382F; --alert-bg:#F6DCD7; --info-bg:#DCE7F1;
  --hp:#C97A1E; --hc:#3570A8;
  --confort:#E7A04F; --eco:#7FA2BF; --nuit:#5B5F9E;
  --shadow:0 1px 0 rgba(28,39,48,.06), 0 8px 24px -12px rgba(28,39,48,.25);
  --r-tile:22px; --r-ctl:12px;
  --font-num:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B21; --surface:#1D262E; --surface-2:#26313A; --ink:#E8EEF2; --ink-2:#A3B1BC; --line:#33414C;
    --cold:#2B4357; --warm:#6E4A22; --off:#2A333B;
    --accent:#7FB3E6; --accent-ink:#0F1A24;
    --ok:#6CC29A; --alert:#F08B80; --alert-bg:#3A2422; --info-bg:#1F3242;
    --hp:#C07A2A; --hc:#4E8BCF;
    --confort:#C9853A; --eco:#56799A; --nuit:#7377BF;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141B21; --surface:#1D262E; --surface-2:#26313A; --ink:#E8EEF2; --ink-2:#A3B1BC; --line:#33414C;
  --cold:#2B4357; --warm:#6E4A22; --off:#2A333B;
  --accent:#7FB3E6; --accent-ink:#0F1A24;
  --ok:#6CC29A; --alert:#F08B80; --alert-bg:#3A2422; --info-bg:#1F3242;
  --hp:#C07A2A; --hc:#4E8BCF;
  --confort:#C9853A; --eco:#56799A; --nuit:#7377BF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100dvh;
  padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom));}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.num{font-family:var(--font-num);font-feature-settings:"tnum" 1;letter-spacing:-.02em}
.muted{color:var(--ink-2)}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* En-tête */
header.top{padding:18px 0 6px;display:flex;align-items:flex-start;gap:12px}
header.top .status{flex:1}
header.top h1{font:800 clamp(28px,8vw,40px)/1.05 var(--font-num);letter-spacing:-.03em;margin:0}
header.top p{margin:6px 0 0;font-size:14px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Bandeaux */
.banner{margin:12px 0 0;padding:12px 14px;border-radius:14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.banner.alert{background:var(--alert-bg);color:var(--ink)}
.banner.alert strong{color:var(--alert)}
.banner.info{background:var(--info-bg)}
.banner svg{width:20px;height:20px;flex:none;margin-top:2px}
.banner .b-body{flex:1}
.banner button{margin-top:8px}

/* Scènes */
.scenes{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:15px}
.scene svg{width:18px;height:18px}
.scene:active{transform:scale(.97)}

/* Tuiles des pièces */
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 0}
@media (min-width:600px){.rooms{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;text-align:left;border:0;border-radius:var(--r-tile);padding:14px 14px 12px;min-height:168px;display:flex;flex-direction:column;
  background:color-mix(in oklab, var(--warm) var(--heat,40%), var(--cold));box-shadow:var(--shadow);overflow:hidden}
.tile.off{background:var(--off)}
.tile .name{font-weight:700;font-size:16px;line-height:1.2}
.tile .temp{font:800 54px/1 var(--font-num);letter-spacing:-.04em;margin-top:auto}
.tile .temp sup{font-size:22px;font-weight:700;vertical-align:28px;margin-left:2px}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb, var(--ink) 9%, transparent);font-weight:700;white-space:nowrap}
.chip.flame svg{width:12px;height:12px}
.tile .pend{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tile.off .temp{color:var(--ink-2)}

/* Barre du bas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .inner{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--ink-2);min-height:52px;border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}

/* Sections */
h2.sec{font:700 22px/1.2 var(--font-num);letter-spacing:-.02em;margin:22px 0 4px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}

/* Boutons */
.btn{border:0;border-radius:var(--r-ctl);padding:12px 16px;min-height:46px;font-weight:700;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--alert-bg);color:var(--alert)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}

/* Feuille (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:30;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:31;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
@media (min-width:720px){.sheet{left:50%;width:640px;margin-left:-320px}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font:800 28px/1.1 var(--font-num);letter-spacing:-.03em;margin:4px 0 2px}
.sheet .close{position:absolute;right:12px;top:12px}
.big-temp{display:flex;align-items:baseline;gap:14px;margin:14px 0 4px}
.big-temp .now{font:800 64px/1 var(--font-num);letter-spacing:-.04em}

/* Interrupteur */
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border-radius:16px;margin:12px 0;font-weight:700}
.toggle{position:relative;width:58px;height:34px;border-radius:999px;border:0;background:var(--surface-2);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{transform:translateX(24px)}

/* Stepper consigne */
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:10px;margin:12px 0}
.stepper button{width:56px;height:56px;border-radius:14px;border:0;background:var(--surface-2);font:700 28px/1 var(--font-num)}
.stepper .val{text-align:center}
.stepper .val b{display:block;font:800 40px/1 var(--font-num);letter-spacing:-.03em}
.stepper .val span{font-size:13px}

/* Segmenté */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin:12px 0}
.seg button{flex:1;border:0;border-radius:10px;padding:10px;background:none;font-weight:700;min-height:44px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.level{background:var(--surface);border-radius:14px;padding:10px 12px;border:0;text-align:left}
.level .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:1px}
.level b{display:block;font:800 26px/1.1 var(--font-num);letter-spacing:-.02em;margin-top:4px}
.level small{font-size:13px;color:var(--ink-2)}

/* Planning */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;min-height:40px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;gap:6px;margin-top:8px}
.day{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;border:0;background:none;padding:4px 0;text-align:left;width:100%}
.day .lbl{font-weight:700;font-size:14px}
.bar{position:relative;height:34px;border-radius:9px;overflow:hidden;display:flex;gap:2px;background:var(--surface)}
.bar i{display:block;height:100%}
.bar i:first-child{border-radius:9px 0 0 9px}.bar i:last-child{border-radius:0 9px 9px 0}
.bar .now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.hours{display:grid;grid-template-columns:40px 1fr;gap:10px;font-size:12px;color:var(--ink-2)}
.hours div{display:flex;justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.slot{display:grid;grid-template-columns:1fr 1.3fr 44px;gap:8px;align-items:center;margin:8px 0}
.slot input,.slot select,.field input,.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px}
.daypick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.daypick label{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}
.field{display:block;margin:12px 0}
.field span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.help{font-size:14px;color:var(--ink-2);margin:6px 0}

/* Conso */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi b{display:block;font:800 36px/1 var(--font-num);letter-spacing:-.03em}
.kpi span{font-size:14px;color:var(--ink-2)}
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}
.rlist .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.rlist .r:first-child{border-top:0}
.rlist .share{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.rlist .share i{display:block;height:100%;background:var(--hp);border-radius:4px}
table.data{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.data th,table.data td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.data th:first-child,table.data td:first-child{text-align:left}
details summary{cursor:pointer;font-weight:700;padding:6px 0}

/* Commandes en cours */
.jobs{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:25;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.job{pointer-events:auto;max-width:520px;width:100%;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.job .j-body{flex:1}
.job b{display:block}
.job .ic{width:20px;height:20px;flex:none}
.job button{border:0;background:color-mix(in srgb, var(--bg) 18%, transparent);color:var(--bg);border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px}
.job.failed,.job.unconfirmed{background:var(--alert);color:#fff}
.job.failed button,.job.unconfirmed button{color:#fff}

/* Accueil / réglages */
.welcome h1{font:800 44px/1 var(--font-num);letter-spacing:-.04em;margin:40px 0 10px}
.empty{padding:30px 0;text-align:center;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="jobs" id="jobs" aria-live="polite"></div>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
